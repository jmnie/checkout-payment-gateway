name: Verify
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream files
        run: sha256sum -c docs/SOURCE_CHECKSUMS.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - name: Python tests and lint
        working-directory: python
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest --cov=payment_gateway_api --cov-report=xml
      - name: Java tests and build
        working-directory: java
        run: ./gradlew test bootJar --no-daemon
      - name: Build and start containers
        run: docker compose up --build --wait --wait-timeout 120
      - name: Container end to end tests
        run: |
          mkdir -p /tmp/gateway-logs
          docker compose logs --no-log-prefix java > /tmp/gateway-logs/java.log
          docker compose logs --no-log-prefix python > /tmp/gateway-logs/python.log
          uv run --project python pytest tests/test_e2e.py -q -k 'not runtime_logs'
          docker compose logs --no-log-prefix java > /tmp/gateway-logs/java.log
          docker compose logs --no-log-prefix python > /tmp/gateway-logs/python.log
          GATEWAY_LOG_DIR=/tmp/gateway-logs uv run --project python pytest tests/test_e2e.py -q -k runtime_logs
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            python/coverage.xml
            java/build/reports/tests/
            java/build/reports/jacoco/
      - name: Stop containers
        if: always()
        run: docker compose down
